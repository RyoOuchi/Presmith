<p class="eyebrow" data-element-id="eyebrow">The live example / illustrative data</p>
<h2 data-element-id="headline">Live in the room.<br>Stable on the page.</h2>
<div class="split">
  <div class="stack">
    <p class="muted" data-element-id="explanation">Explore an idea with a small interaction. Export a defined snapshot of the same slide.</p>
    <label class="lab-label" for="adoption" data-element-id="slider-label">Illustrative adoption <output id="adoption-label">60%</output></label>
    <input id="adoption" data-element-id="slider" aria-label="Illustrative adoption percentage" type="range" min="10" max="90" value="60">
    <p class="caption" data-element-id="export-note">Export state: 60%. Example values only;<br>not a forecast or measured product result.</p>
  </div>
  <figure data-element-id="chart">
    <svg class="diagram lab-chart" viewBox="0 0 520 250" role="img" aria-label="Illustrative adoption is 60 percent">
      <line x1="32" y1="200" x2="488" y2="200" stroke="#3c4c53"/>
      <rect x="60" y="44" width="112" height="156" fill="#52656c"/>
      <rect id="adoption-bar" x="258" y="96" width="112" height="104" fill="#d9ef80"/>
      <text x="60" y="30" fill="#a6b7be" font-size="20">90%</text>
      <text id="chart-value" x="258" y="82" fill="#d9ef80" font-size="20">60%</text>
      <text x="60" y="234" fill="#a6b7be" font-size="20">Reference</text>
      <text x="258" y="234" fill="#f6f3eb" font-size="20">Scenario</text>
    </svg>
    <figcaption data-element-id="caption">Drag the slider in the HTML presentation.</figcaption>
  </figure>
</div>
