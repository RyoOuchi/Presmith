[package]
name = "presmith"
version = "0.2.1"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/RyoOuchi/Presmith"
description = "Local, source-first presentations for coding agents"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync"] }
ctrlc = { version = "3", features = ["termination"] }
percent-encoding = "2"
html5gum = "=0.8.3"
sha2 = "=0.10.9"
base64 = "=0.22.1"
getrandom = "=0.2.17"
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[dev-dependencies]

[target.'cfg(unix)'.dependencies]
libc = "0.2"
